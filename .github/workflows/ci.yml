name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: knomes
          POSTGRES_PASSWORD: knomes
          POSTGRES_DB: knomes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knomes -d knomes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://knomes:knomes@localhost:5432/knomes
      TEST_DATABASE_URL: postgresql+psycopg://knomes:knomes@localhost:5432/knomes_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Migration smoke test (alembic upgrade head)
        run: uv run alembic upgrade head

      - name: Create test database
        run: |
          PGPASSWORD=knomes psql -h localhost -U knomes -d postgres \
            -tc "SELECT 1 FROM pg_database WHERE datname = 'knomes_test'" | grep -q 1 \
            || PGPASSWORD=knomes psql -h localhost -U knomes -d postgres \
                 -c "CREATE DATABASE knomes_test"

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    name: frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  playwright-smoke:
    name: playwright smoke (hermetic build + start + browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hermetic: no API is started; the homepage must render without live data.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npx playwright test
