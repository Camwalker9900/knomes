name: knomes

x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://knomes:knomes@db:5432/knomes
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000

x-api-depends-on: &api-depends-on
  db:
    condition: service_healthy
  redis:
    condition: service_started
  minio:
    condition: service_started

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: knomes
      POSTGRES_PASSWORD: knomes
      POSTGRES_DB: knomes
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knomes -d knomes"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: ./apps/api
    image: knomes-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *api-environment
    ports:
      - "8000:8000"
    depends_on: *api-depends-on
    volumes:
      - ./apps/api:/srv/api
      - /srv/api/.venv

  worker:
    build: ./apps/api
    image: knomes-api
    command: rq worker --url redis://redis:6379/0 default
    environment: *api-environment
    depends_on: *api-depends-on
    volumes:
      - ./apps/api:/srv/api
      - /srv/api/.venv

  web:
    build: ./apps/web
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./apps/web:/srv/web
      - /srv/web/node_modules

volumes:
  pgdata:
  miniodata:
