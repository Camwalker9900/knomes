<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- Knomes gnome icon — faithful vectorization of logo/raw.png. Design unchanged. -->
  <defs>
    <path id="hat" d="M 656 112
      C 670 100 682 108 685 132
      C 692 205 706 280 728 352
      C 756 442 792 532 832 618
      C 854 664 882 706 908 738
      C 916 744 916 752 910 757
      C 884 764 862 764 846 760
      C 818 750 788 734 758 721
      C 716 706 668 699 627 699
      C 586 699 545 703 512 716
      C 488 725 466 734 448 742
      C 420 755 396 762 372 761
      C 358 760 348 762 342 754
      C 338 748 338 742 342 736
      C 364 706 390 670 414 634
      C 442 578 460 514 474 448
      C 494 354 542 224 612 142
      C 628 122 644 112 656 112 Z"/>
    <clipPath id="hatClip"><use href="#hat"/></clipPath>
  </defs>

  <!-- background: full-bleed iOS-style rounded square -->
  <rect x="0" y="0" width="1254" height="1254" rx="280" fill="#032042"/>

  <!-- body / shoulders -->
  <path fill="#15537F" d="M 400 858
    C 368 866 346 892 340 932
    C 332 986 332 1032 344 1072
    C 354 1106 380 1128 432 1128
    L 822 1128
    C 874 1128 900 1106 910 1072
    C 922 1032 922 986 914 932
    C 908 892 886 866 854 858
    C 780 850 474 850 400 858 Z"/>

  <!-- ears (tops tucked under the hat brim) -->
  <circle cx="382" cy="802" r="42" fill="#F9B584"/>
  <circle cx="870" cy="802" r="42" fill="#F9B584"/>

  <!-- face -->
  <ellipse cx="627" cy="794" rx="226" ry="106" fill="#FDCDA2"/>

  <!-- hat cone with brim -->
  <use href="#hat" fill="#ED5621"/>

  <!-- shadow strip under the roof band (parallel chevron, clipped to hat) -->
  <path clip-path="url(#hatClip)" fill="#C04119"
        d="M 320 796 L 627 489 L 934 796 L 934 848 L 627 541 L 320 848 Z"/>

  <!-- face top over hat brim center -->
  <path fill="#FDCDA2" d="M 448 760 C 500 706 560 688 627 688 C 694 688 754 706 806 760 C 760 800 494 800 448 760 Z"/>

  <!-- chimney (stack bottom slants parallel to the roof band, hidden behind it) -->
  <path fill="#FFFFFF" d="M 762 505 L 835 505 L 835 662 L 762 590 Z"/>
  <rect x="750" y="470" width="97" height="42" rx="9" fill="#FFFFFF"/>

  <!-- roof band -->
  <path d="M 341 745 L 627 462 L 913 745" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- window: four panes -->
  <g fill="#FFFFFF">
    <rect x="581" y="576" width="40" height="40" rx="7"/>
    <rect x="633" y="576" width="40" height="40" rx="7"/>
    <rect x="581" y="628" width="40" height="40" rx="7"/>
    <rect x="633" y="628" width="40" height="40" rx="7"/>
  </g>

  <!-- eyes (closed, happy) -->
  <g fill="none" stroke="#0D2B4E" stroke-width="16" stroke-linecap="round">
    <path d="M 480 780 A 30 30 0 0 1 540 780"/>
    <path d="M 725 780 A 30 30 0 0 1 785 780"/>
  </g>

  <!-- beard -->
  <path fill="#FFFFFF" d="M 410 830
    C 452 804 516 796 558 812
    C 588 825 608 831 627 831
    C 646 831 666 825 696 812
    C 738 796 802 804 844 830
    C 870 858 884 894 878 924
    C 872 984 846 1036 806 1068
    C 762 1102 700 1120 627 1120
    C 554 1120 490 1102 448 1066
    C 408 1036 382 984 376 924
    C 370 894 384 858 410 830 Z"/>

  <!-- beard creases (body blue showing through the split strands) -->
  <g fill="none" stroke="#15537F" stroke-width="7" stroke-linecap="round">
    <path d="M 426 956 C 434 1000 456 1044 494 1078"/>
    <path d="M 828 956 C 820 1000 798 1044 760 1078"/>
  </g>

  <!-- shadow under nose on beard -->
  <ellipse cx="627" cy="830" rx="66" ry="24" fill="#D8D9DA"/>

  <!-- nose (base = soft bottom rim, overlay = main tone) -->
  <ellipse cx="628" cy="786" rx="70" ry="49" fill="#EE9762"/>
  <ellipse cx="628" cy="780" rx="66" ry="45" fill="#F9A76F"/>

  <!-- door + knob -->
  <path fill="#072346" d="M 567 1112 L 567 990 A 59.5 59.5 0 0 1 686 990 L 686 1112 Z"/>
  <circle cx="662" cy="1030" r="13" fill="#F3F4F6"/>
</svg>
